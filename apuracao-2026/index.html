<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Apuração 2026">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./app.css?v=5.20">
<title>Apuração Presidencial 2026 · 2º Turno</title>
<script>
  (()=>{const mark=()=>{const root=document.documentElement;root.dataset.scrollX=(root.scrollWidth<=root.clientWidth+1?'ok':'bad')};addEventListener('load',()=>{mark();let n=0;const t=setInterval(()=>{mark();if(++n>=30)clearInterval(t)},500)})})();
  </script>
</head>
<body class="president-only">
<header class="appbar">
  <div class="appbar-in">
    <button class="brand" aria-label="Ir para Agora">
      <span class="brand-mark">26</span>
      <span class="brand-copy"><strong>Presidente 2026</strong><small>2º turno · dados oficiais do TSE</small></span>
    </button>
    <div class="presidential-top-label"><span></span> APURAÇÃO PRESIDENCIAL · 2º TURNO</div>
    <div class="grow"></div>
    <div class="live-pill"><span class="live-dot"></span><span id="liveTime">TSE · conectando</span></div>
    <button id="refreshBtn" class="icon-btn" aria-label="Atualizar agora" title="Atualizar agora">↻</button>
    <button id="themeBtn" class="icon-btn" aria-label="Alternar tema" title="Alternar tema">☾</button>
  </div>
</header>

<main class="shell presidential-shell">
  <section id="view-presidente" class="view active"><div id="presidentContent"></div></section>
  <div class="footer-note">Fonte: Tribunal Superior Eleitoral · Apuração oficial da eleição para Presidente da República.</div>
</main>



<script>
window.__apFatal=function(err){
  var msg=(err&&err.message)?err.message:String(err||'Erro desconhecido');
  var active=document.getElementById('presidentContent');
  if(active)active.innerHTML='<div class="card pad" style="margin-top:18px"><div class="alert danger"><strong>Falha ao iniciar o painel.</strong><br>'+String(msg).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'<br><button class="primary-btn" style="margin-top:10px" onclick="location.reload()">Recarregar</button></div></div>';
};
window.addEventListener('error',function(e){window.__apFatal(e.error||e.message)});
window.addEventListener('unhandledrejection',function(e){window.__apFatal(e.reason||'Falha assíncrona')});
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
}
if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}
</script>
<script defer src="./app.bundle.js?v=5.20"></script>
</body>
</html>
