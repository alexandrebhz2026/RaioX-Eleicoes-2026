<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#073b74">
  <title>Colinha de votação 2026</title>
  <style>
    html,body{margin:0;min-height:100%;background:#073b74}
    body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .loading{color:#fff;font-weight:800;font-size:15px;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="loading" id="loading">Carregando colinha…</div>
  <script>
    (async function(){
      const BASE="https://fhuxpbxydbflwhwcstps.supabase.co/functions/v1/colinha-2260-55240-222";
      try{
        const r=await fetch(BASE,{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        let page=await r.text();
        page=page.replace(
          "const SELF=location.origin+location.pathname.replace(/\\/$/,'');",
          "const SELF='https://fhuxpbxydbflwhwcstps.supabase.co/functions/v1/colinha-2260-55240-222';"
        );
        document.open();
        document.write(page);
        document.close();
      }catch(e){
        document.getElementById("loading").textContent="Não foi possível carregar a colinha. Atualize a página.";
      }
    })();
  </script>
</body>
</html>
