name: Apuracao 2026 QA
on:
  push:
    paths:
      - 'apuracao-2026/**'
      - '.github/workflows/apuracao-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check apuracao-2026/app.js
          node --check apuracao-2026/app.bundle.js
          node --check apuracao-2026/engine.js
          node --check apuracao-2026/api/search.js
          node --check apuracao-2026/api/congress.js
          node --check apuracao-2026/api/summary.js
          node --check apuracao-2026/api/tse.js

      - name: Required features present
        run: |
          grep -q "calcularProporcional" apuracao-2026/app.bundle.js
          grep -q "createHemicycle" apuracao-2026/app.bundle.js
          grep -q "ELEITO · TSE" apuracao-2026/app.bundle.js
          grep -q "2º TURNO · TSE" apuracao-2026/app.bundle.js
          grep -q "TSE agora" apuracao-2026/app.bundle.js
          grep -q "A conta" apuracao-2026/app.bundle.js
          grep -q "Congresso" apuracao-2026/index.html
          grep -q "Favoritos" apuracao-2026/index.html
          grep -q "function renderFavoritesPage" apuracao-2026/app.bundle.js
          grep -q "favoriteButton" apuracao-2026/app.bundle.js
          grep -q "loadFavoritesView" apuracao-2026/app.bundle.js
          grep -q 'data-view="favoritos"' apuracao-2026/index.html
          grep -q "favorite-btn" apuracao-2026/app.css
          grep -q "card-action" apuracao-2026/app.css

      - name: Headless browser runtime
        run: |
          set -e
          base="https://apuracao-2026-lake.vercel.app"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$base/?qa=$GITHUB_SHA" > /tmp/apuracao-dom.html
          grep -q "Apuração em tempo real" /tmp/apuracao-dom.html
          grep -q "Governadores por UF" /tmp/apuracao-dom.html
          grep -q "Favoritos" /tmp/apuracao-dom.html
          grep -q "Favoritos" /tmp/apuracao-dom.html

      - name: Live deployment smoke tests
        run: |
          set -e
          base="https://apuracao-2026-lake.vercel.app"
          curl -fsS --retry 3 "$base/" | grep -q "Apuração 2026"
          curl -fsS --retry 3 "$base/app.bundle.js?v=4.4" | grep -q "function orderedCandidates"
          curl -fsS --retry 3 "$base/api/search?q=ana%20paula%20siqueira&uf=mg&cargo=7" | grep -q "ANA PAULA SIQUEIRA"
          curl -fsS --retry 3 "$base/api/congress?kind=camara" | grep -q '"seatsTotal":513'
          curl -fsS --retry 3 "$base/api/congress?kind=senado" | grep -q '"seatsContested":54'
          curl -fsS --retry 3 "$base/api/tse?path=%2Foficial%2Fele2026%2F6257%2Fdados%2Fbr%2Fbr-c0001-e006257-u.json" | grep -q '"ele" : "6257"'
