name: Build RAIO-X Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore approved visual assets
        working-directory: app
        run: |
          mkdir -p assets
          base64 -d assets/raiox-icon.png.b64 > assets/raiox-icon.png
          base64 -d assets/xis-avatar.jpg.b64 > assets/xis-avatar.jpg
          test -s assets/raiox-icon.png
          test -s assets/xis-avatar.jpg
          file assets/raiox-icon.png | grep -q PNG
          file assets/xis-avatar.jpg | grep -q JPEG

      - name: Apply approved Xis v0.3.19 UI
        working-directory: app
        run: |
          python3 patch_v019.py
          grep -q "const XIS_AVATAR=require('./assets/xis-avatar.jpg')" App.js
          grep -q 'Fala com o Xis' App.js
          grep -q 'v0.3.19' App.js
          grep -q "APP_VERSION='0.3.19'" AuthGate.js
          grep -q 'Local, TSE e cache são ilimitados' App.js
          if grep -q 'function XisFace({large=false}).*xisAntenna' App.js; then echo 'Legacy block Xis still present'; exit 1; fi

      - name: Verify RAIO-X v0.3.19 source
        working-directory: app
        run: |
          grep -q '"version": "0.3.19"' app.json
          grep -q '"versionCode": 23' app.json
          grep -q '"xisUi": "official-v019"' app.json
          grep -q '"xisAiPolicy": "local-tse-cache-ai"' app.json
          grep -q '"version": "0.3.19"' package.json
          grep -q '"expo-local-authentication": "~56.0.4"' package.json
          grep -q '"expo-secure-store": "~56.0.4"' package.json
          grep -q '"react-native": "0.85.3"' package.json
          grep -q 'googleServicesFile' app.json
          grep -q '@react-native-google-signin/google-signin' package.json
          grep -q "HOURLY_LIMIT=10" XisEngine.js
          grep -q "DAILY_LIMIT=25" XisEngine.js
          grep -q "raiox-xis-ai.vercel.app/api/xis" XisEngine.js
          if grep -q '"firebase"' package.json; then echo 'Firebase JS SDK must not be bundled'; exit 1; fi

      - name: Generate audited TSE snapshot and official photos
        working-directory: app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js
          grep -q "130002539775" candidate_photos.js

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verify installed Expo native modules
        working-directory: app
        run: |
          node -p "require('./node_modules/expo-local-authentication/package.json').version" | grep -q '^56\.0\.'
          node -p "require('./node_modules/expo-secure-store/package.json').version" | grep -q '^56\.0\.'
          npx expo install --check

      - name: Expo prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Verify Google Services native wiring
        working-directory: app
        run: |
          test -s android/app/google-services.json
          grep -q 'com.raiox2026.app' android/app/google-services.json

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Verify APK and Xis build marker
        run: |
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'index.android.bundle|assets/.+\.bundle'
          unzip -p "$APK" assets/app.config | grep -q '"version":"0.3.19"'
          unzip -p "$APK" assets/app.config | grep -q '"versionCode":23'
          unzip -p "$APK" assets/app.config | grep -q '"xisUi":"official-v019"'
          unzip -p "$APK" assets/app.config | grep -q '"xisAiPolicy":"local-tse-cache-ai"'
          cp "$APK" RAIO-X-Eleicoes-2026-v0.3.19-XIS-OFICIAL.apk
          sha256sum RAIO-X-Eleicoes-2026-v0.3.19-XIS-OFICIAL.apk
          ls -lh RAIO-X-Eleicoes-2026-v0.3.19-XIS-OFICIAL.apk

      - name: Upload workflow APK
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-v0.3.19-XIS-OFICIAL-APK
          path: RAIO-X-Eleicoes-2026-v0.3.19-XIS-OFICIAL.apk
          if-no-files-found: error
          retention-days: 14
