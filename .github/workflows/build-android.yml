name: Build RAIO-X Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify crash-safe REST auth v0.3.6 source
        working-directory: app
        run: |
          grep -q '"version": "0.3.6"' app.json
          grep -q '"versionCode": 10' app.json
          grep -q 'googleServicesFile' app.json
          grep -q '@react-native-google-signin/google-signin' package.json
          if grep -q '"firebase"' package.json; then echo 'Firebase JS SDK must not be bundled in v0.3.6'; exit 1; fi
          grep -q 'identitytoolkit.googleapis.com' AuthGate.js
          grep -q 'firestore.googleapis.com' AuthGate.js
          grep -q "require('@react-native-google-signin/google-signin')" AuthGate.js
          if grep -q "from 'firebase/" AuthGate.js; then echo 'Unsafe Firebase JS import found'; exit 1; fi
          grep -q '982564347981-p5do7903lh1e5a7perh9bv5i1ek8rllh.apps.googleusercontent.com' google-services.json

      - name: Generate audited TSE snapshot and official photos
        working-directory: app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js
          grep -q "130002539775" candidate_photos.js

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Verify Google Services native wiring
        working-directory: app
        run: |
          test -s android/app/google-services.json
          grep -q 'com.raiox2026.app' android/app/google-services.json

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Verify APK and JS bundle
        run: |
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'index.android.bundle|assets/.+\.bundle'
          cp "$APK" RAIO-X-Eleicoes-2026-v0.3.6.apk
          sha256sum RAIO-X-Eleicoes-2026-v0.3.6.apk
          ls -lh RAIO-X-Eleicoes-2026-v0.3.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-v0.3.6-APK
          path: RAIO-X-Eleicoes-2026-v0.3.6.apk
          if-no-files-found: error
          retention-days: 14
