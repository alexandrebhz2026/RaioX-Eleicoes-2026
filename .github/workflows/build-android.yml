name: Build RAIO-X Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore approved RAIO-X icon
        working-directory: app
        run: |
          mkdir -p assets
          base64 -d assets/raiox-icon.png.b64 > assets/raiox-icon.png
          test -s assets/raiox-icon.png
          file assets/raiox-icon.png | grep -q PNG

      - name: Verify RAIO-X v0.3.16 hotfix source
        working-directory: app
        run: |
          grep -q '"version": "0.3.16"' app.json
          grep -q '"versionCode": 20' app.json
          grep -q 'googleServicesFile' app.json
          grep -q '@react-native-google-signin/google-signin' package.json
          grep -q "require('./App')" index.js
          grep -q 'StartupBoundary' index.js
          grep -q "HOURLY_LIMIT=10" XisEngine.js
          grep -q "DAILY_LIMIT=25" XisEngine.js
          grep -q "raiox-xis-ai.vercel.app/api/xis" XisEngine.js
          if grep -q "googleServices from './google-services.json'" XisEngine.js; then echo 'Unsafe runtime JSON import found in XisEngine'; exit 1; fi
          if grep -q '"firebase"' package.json; then echo 'Firebase JS SDK must not be bundled'; exit 1; fi
          grep -q 'identitytoolkit.googleapis.com' AuthGate.js
          grep -q 'firestore.googleapis.com' AuthGate.js
          grep -q "require('@react-native-google-signin/google-signin')" AuthGate.js
          if grep -q "from 'firebase/" AuthGate.js; then echo 'Unsafe Firebase JS import found'; exit 1; fi

      - name: Generate audited TSE snapshot and official photos
        working-directory: app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js
          grep -q "130002539775" candidate_photos.js

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Verify Google Services native wiring
        working-directory: app
        run: |
          test -s android/app/google-services.json
          grep -q 'com.raiox2026.app' android/app/google-services.json

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Verify APK and JS bundle
        run: |
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'index.android.bundle|assets/.+\.bundle'
          unzip -p "$APK" assets/app.config | grep -q '"version":"0.3.16"'
          unzip -p "$APK" assets/app.config | grep -q '"versionCode":20'
          cp "$APK" RAIO-X-Eleicoes-2026-v0.3.16-HOTFIX.apk
          sha256sum RAIO-X-Eleicoes-2026-v0.3.16-HOTFIX.apk
          ls -lh RAIO-X-Eleicoes-2026-v0.3.16-HOTFIX.apk

      - name: Upload workflow APK
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-v0.3.16-HOTFIX-APK
          path: RAIO-X-Eleicoes-2026-v0.3.16-HOTFIX.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v0.3.16 release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.16
          name: RAIO-X Eleições 2026 v0.3.16 Hotfix
          body: |
            Hotfix de inicialização após falhas contínuas na v0.3.15.
            Remove importação JSON do motor Xis em runtime e adiciona contenção de falhas na inicialização.
            Mantém endpoint Xis isolado, GPT-5.4 nano, cache e limites 10/h e 25/dia.
          files: RAIO-X-Eleicoes-2026-v0.3.16-HOTFIX.apk
          fail_on_unmatched_files: true
