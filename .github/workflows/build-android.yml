name: Build RAIO-X Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify crash-safe v0.3.4 source
        working-directory: app
        run: |
          grep -q '"version": "0.3.4"' app.json
          grep -q '"versionCode": 8' app.json
          grep -q 'Versão de teste v0.3.4' AuthGate.js
          if grep -q 'useAuthRequest' AuthGate.js; then echo 'Unsafe social auth hook found'; exit 1; fi

      - name: Generate audited TSE snapshot and official photos
        working-directory: app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js
          grep -q "130002539775" candidate_photos.js

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Verify APK and JS bundle
        run: |
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'index.android.bundle|assets/.+\.bundle'
          cp "$APK" RAIO-X-Eleicoes-2026-v0.3.4.apk
          sha256sum RAIO-X-Eleicoes-2026-v0.3.4.apk
          ls -lh RAIO-X-Eleicoes-2026-v0.3.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-v0.3.4-APK
          path: RAIO-X-Eleicoes-2026-v0.3.4.apk
          if-no-files-found: error
          retention-days: 14
