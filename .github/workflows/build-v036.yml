name: Build RAIO-X v0.3.36 APK

on:
  push:
    branches: [v0.3.36-pesquisas-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore bundled assets
        working-directory: app
        run: |
          mkdir -p assets
          base64 -d assets/raiox-icon.png.b64 > assets/raiox-icon.png
          cat assets/xis-v025-chunk00.b64 assets/xis-v025-chunk01.b64 assets/xis-v025-chunk02.b64 assets/xis-v025-chunk03.b64 assets/xis-v025-chunk04.b64 assets/xis-v025-chunk05.b64 > assets/xis-intro-v9.complete.b64
          base64 -d assets/xis-intro-v9.complete.b64 > assets/xis-intro-v9.mp4
          base64 -d assets/xis-oficial-v026.webp.b64 > assets/xis-oficial-v026.webp
          base64 -d assets/xis-oficial-full-v027.webp.b64 > assets/xis-oficial-full-v027.webp
          test -s assets/xis-intro-v9.mp4
          test -s assets/xis-oficial-v026.webp
          test -s assets/xis-oficial-full-v027.webp

      - name: Build v0.3.36 source
        working-directory: app
        run: python3 build_v036_clean.py

      - name: Verify v0.3.36 source
        working-directory: app
        run: |
          grep -q '"version": "0.3.36"' app.json
          grep -q '"versionCode": 40' app.json
          grep -q '"version": "0.3.36"' package.json
          grep -q "const VERSION='0.3.36'" AppV020.js
          grep -q "const APP_VERSION='0.3.36'" AuthGateV020.js
          grep -q "'X-App-Version':'0.3.36'" XisEngine.js
          grep -q "function LocationPermissionScreen" AppV020.js
          grep -q "function StatePickerScreen" AppV020.js
          grep -q "function PollTopTwo" AppV020.js
          grep -q "function PollCandidatePhoto" AppV020.js
          grep -q "1º E 2º COLOCADOS" AppV020.js
          grep -q "fontSize:15,fontWeight:'900'" AppV020.js
          grep -q "raiox.polls.preference.v036" AppV020.js
          grep -q "raiox.polls.preference.v035" AppV020.js
          grep -q "raiox.polls.uf.v032" AppV020.js
          ! grep -q "Resumo do Xis" AppV020.js
          ! grep -q "function LocationConsentModal" AppV020.js
          ! grep -q "function StatePickerModal" AppV020.js
          grep -q "\['Apuração','◉'\]" AppV020.js
          grep -q "setInterval(load,20000)" AppV020.js
          grep -q "FAVORITO" AppV020.js
          grep -q "expo-location" package.json

      - name: Generate audited TSE snapshot and photos
        working-directory: app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Verify Android wiring
        working-directory: app
        run: |
          test -s android/app/google-services.json
          grep -q 'com.raiox2026.app' android/app/google-services.json
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Prepare APK
        run: |
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" RAIO-X-Eleicoes-2026-v0.3.36-PESQUISAS-FINAL.apk
          sha256sum RAIO-X-Eleicoes-2026-v0.3.36-PESQUISAS-FINAL.apk
          ls -lh RAIO-X-Eleicoes-2026-v0.3.36-PESQUISAS-FINAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-v0.3.36-PESQUISAS-FINAL-APK
          path: RAIO-X-Eleicoes-2026-v0.3.36-PESQUISAS-FINAL.apk
          if-no-files-found: error
          retention-days: 14
