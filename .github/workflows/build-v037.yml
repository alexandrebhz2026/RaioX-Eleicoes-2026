name: Build RAIO-X v0.3.10 Search Login

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify v0.3.10 search and safe login
        working-directory: app
        run: |
          grep -q '"version": "0.3.10"' app.json
          grep -q '"versionCode": 14' app.json
          grep -q 'v0.3.10' App.js
          grep -q 'PAGE_SIZE=30' App.js
          grep -q 'Carregar mais' App.js
          grep -q 'accounts:${endpoint}' App.js
          grep -q 'function Account' App.js
          if grep -q '@react-native-google-signin' App.js; then echo 'Google native module must stay out of startup-safe build'; exit 1; fi
          if grep -q 'expo-local-authentication' App.js; then echo 'Biometric native module must stay out of startup-safe build'; exit 1; fi
          if grep -q 'firebase/auth' App.js; then echo 'Firebase JS auth must stay out of startup-safe build'; exit 1; fi

      - name: Generate TSE snapshot
        working-directory: app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Package APK
        run: |
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" RAIO-X-Eleicoes-2026-v0.3.10.apk
          sha256sum RAIO-X-Eleicoes-2026-v0.3.10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-v0.3.10-APK
          path: RAIO-X-Eleicoes-2026-v0.3.10.apk
          if-no-files-found: error
          retention-days: 14
