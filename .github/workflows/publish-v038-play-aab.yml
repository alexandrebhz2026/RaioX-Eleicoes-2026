name: Publish exact v0.3.38 Play AAB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v038-play-aab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AAB_NAME: RAIO-X-Eleicoes-2026-v0.3.38-TEMPO-REAL-PlayStore.aab
      TAG: v0.3.38-playstore-build42
      EXPECTED_SHA256: 93094fca18be274a8fb3a9e87dcec8e972f5b50671c00be2b44be9107cd50176
      SOURCE_URL: 'https://release-assets.githubusercontent.com/github-production-release-asset/1343984558/e0b9f4ff-a20a-43df-8931-7c4c4d424237?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-15T02%3A19%3A27Z&rscd=attachment%3B+filename%3DRAIO-X-Eleicoes-2026-v0.3.38-TEMPO-REAL-PlayStore.aab&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-15T01%3A19%3A27Z&ske=2026-09-15T02%3A19%3A27Z&sks=b&skv=2018-11-09&sig=UidcpLIN353uObp2kXk7R9Af8LoPcV%2BGrtFbGjrVSO8%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4OTQzODI3OCwibmJmIjoxNzg5NDM2NDc4LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.F7YKGFLJHMme94_KOwQS6DQp9o8zRiFhSgNTW1Bg1zI&response-content-disposition=attachment%3B%20filename%3DRAIO-X-Eleicoes-2026-v0.3.38-TEMPO-REAL-PlayStore.aab&response-content-type=application%2Foctet-stream'
    steps:
      - name: Download exact private release AAB
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$AAB_NAME"
          test -s "$AAB_NAME"
          ACTUAL="$(sha256sum "$AAB_NAME" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$ACTUAL" "$AAB_NAME" > "$AAB_NAME.sha256.txt"
          ls -lh "$AAB_NAME"

      - name: Publish public AAB release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$AAB_NAME" \
            "$AAB_NAME.sha256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RAIO-X Eleições 2026 v0.3.38 - Google Play" \
            --notes "Google Play App Bundle built from the exact v0.3.38 realtime-refresh source. Android package: com.raiox2026.app. versionCode: 42. targetSdk: 36. SHA-256: 93094fca18be274a8fb3a9e87dcec8e972f5b50671c00be2b44be9107cd50176."
