name: Publicar colinhas

on:
  push:
    branches: ["main"]
    paths:
      - "colinha-2260-55240-222/**"
      - "colinha-ana-paula-pages/**"
      - ".github/workflows/colinha-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build combined Pages artifact
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages/ana-paula
          cp -R colinha-2260-55240-222/. .pages/
          cp -R colinha-ana-paula-pages/. .pages/ana-paula/
          mkdir -p .pages/apuracao-2026
          cp -R apuracao-2026/. .pages/apuracao-2026/
          rm -rf .pages/apuracao-2026/api
          touch .pages/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
