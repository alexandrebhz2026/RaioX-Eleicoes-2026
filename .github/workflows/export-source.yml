name: Export RAIO-X Complete Source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package complete source
        run: |
          git archive --format=zip --output=RAIO-X-Eleicoes-2026-projeto-completo-v0.3.14.zip HEAD
          unzip -t RAIO-X-Eleicoes-2026-projeto-completo-v0.3.14.zip >/dev/null
          sha256sum RAIO-X-Eleicoes-2026-projeto-completo-v0.3.14.zip
          ls -lh RAIO-X-Eleicoes-2026-projeto-completo-v0.3.14.zip

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RAIO-X-Eleicoes-2026-projeto-completo-v0.3.14
          path: RAIO-X-Eleicoes-2026-projeto-completo-v0.3.14.zip
          if-no-files-found: error
          retention-days: 14
