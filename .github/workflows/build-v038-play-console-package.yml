name: Build v0.3.38 for Play Console package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v038-play-console-package.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: v0.3.38-play-console-package43
      AAB_NAME: RAIO-X-Eleicoes-2026-v0.3.38-PlayStore-TO-SIGN.aab
    steps:
      - name: Checkout exact realtime source
        uses: actions/checkout@v4
        with:
          ref: v0.3.38-realtime-refresh
          path: src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore bundled assets
        working-directory: src/app
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 -d assets/raiox-icon.png.b64 > assets/raiox-icon.png
          cat assets/xis-v025-chunk00.b64 assets/xis-v025-chunk01.b64 assets/xis-v025-chunk02.b64 assets/xis-v025-chunk03.b64 assets/xis-v025-chunk04.b64 assets/xis-v025-chunk05.b64 > assets/xis-intro-v9.complete.b64
          base64 -d assets/xis-intro-v9.complete.b64 > assets/xis-intro-v9.mp4
          base64 -d assets/xis-oficial-v026.webp.b64 > assets/xis-oficial-v026.webp
          base64 -d assets/xis-oficial-full-v027.webp.b64 > assets/xis-oficial-full-v027.webp
          test -s assets/raiox-icon.png
          test -s assets/xis-intro-v9.mp4

      - name: Apply exact v0.3.38 source
        working-directory: src/app
        run: python3 build_v038.py

      - name: Match existing Play Console application
        working-directory: src/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app.json')
          app=json.loads(p.read_text(encoding='utf-8'))
          app['expo']['version']='0.3.38'
          app['expo']['android']['package']='com.raiox.eleicoes2026'
          app['expo']['android']['versionCode']=43
          app['expo']['android'].pop('googleServicesFile',None)
          app['expo'].setdefault('extra',{})['release']='realtime-hard-refresh-v038-play-console'
          p.write_text(json.dumps(app,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          grep -q '"version": "0.3.38"' app.json
          grep -q '"versionCode": 43' app.json
          grep -q '"package": "com.raiox.eleicoes2026"' app.json
          grep -q "const VERSION='0.3.38'" AppV020.js
          grep -q "const APP_VERSION='0.3.38'" AuthGateV020.js
          grep -q "'X-App-Version':'0.3.38'" XisEngine.js

      - name: Generate audited TSE snapshot and photos
        working-directory: src/app
        run: |
          python3 build_snapshot.py
          test -s tse_candidates_2026.json
          test -s candidate_photos.js

      - name: Install dependencies
        working-directory: src/app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild Android
        working-directory: src/app
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Force API 36 and verify package
        working-directory: src/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'compileSdk(?:Version)?\s+rootProject\.ext\.compileSdkVersion','compileSdk 36',s,count=1)
          s=re.sub(r'targetSdkVersion\s+rootProject\.ext\.targetSdkVersion','targetSdkVersion 36',s,count=1)
          p.write_text(s)
          PY
          grep -q 'com.raiox.eleicoes2026' android/app/build.gradle
          grep -Eq 'targetSdkVersion[[:space:]]+36' android/app/build.gradle

      - name: Build App Bundle
        working-directory: src/app/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Verify AAB identity
        run: |
          set -euo pipefail
          AAB=src/app/android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -p "$AAB" base/assets/app.config | grep -q '"version":"0.3.38"'
          unzip -p "$AAB" base/assets/app.config | grep -q '"versionCode":43'
          unzip -p "$AAB" base/assets/app.config | grep -q '"package":"com.raiox.eleicoes2026"'
          cp "$AAB" "$AAB_NAME"
          sha256sum "$AAB_NAME" > "$AAB_NAME.sha256.txt"
          cat "$AAB_NAME.sha256.txt"

      - name: Publish release for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            "$AAB_NAME" \
            "$AAB_NAME.sha256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RAIO-X v0.3.38 Play package com.raiox.eleicoes2026" \
            --notes "Exact v0.3.38 realtime build for the existing Play Console app. Package com.raiox.eleicoes2026, versionCode 43, targetSdk 36."
