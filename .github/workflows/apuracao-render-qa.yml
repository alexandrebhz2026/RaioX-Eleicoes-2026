name: Apuracao 2026 Render QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'apuracao-2026/**'
      - '.github/workflows/apuracao-render-qa.yml'

jobs:
  qa-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render auto deploy
        run: sleep 20
      - name: Validate Render page in Chrome
        run: |
          set -e
          base="https://apuracao-2026.onrender.com"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          for i in 1 2 3 4 5; do
            "$browser" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$base/?qa=$GITHUB_SHA&try=$i" > /tmp/apuracao-render.html || true
            if grep -q "Apuração em tempo real" /tmp/apuracao-render.html && grep -q "Favoritos" /tmp/apuracao-render.html; then
              break
            fi
            sleep 10
          done
          for needle in "Apuração em tempo real" "Governadores por UF" "Favoritos" "Eleitos" 'id="brmap"' "state_mg" "governor-map-counters" "seções/urnas"; do
            if ! grep -q "$needle" /tmp/apuracao-render.html; then
              echo "FAILED DOM MARKER: $needle"
              grep -o "Falha ao iniciar o painel[^<]*" /tmp/apuracao-render.html || true
              grep -o "Não foi possível carregar esta tela agora[^<]*" /tmp/apuracao-render.html || true
              tail -c 12000 /tmp/apuracao-render.html || true
              exit 1
            fi
          done
          grep -q "card-action" apuracao-2026/app.css
          grep -q "favorite-btn" apuracao-2026/app.css
          grep -q "view-eleitos" apuracao-2026/index.html
          grep -q "FAVORITE_HISTORY_KEY" apuracao-2026/app.bundle.js
          grep -q "createStateShareImage" apuracao-2026/app.bundle.js
          grep -q "openStateQuickSummary" apuracao-2026/app.bundle.js
          grep -q "liveEventsPanel" apuracao-2026/app.bundle.js
          grep -q "Linha de corte" apuracao-2026/app.bundle.js
          grep -q "async function loadElected" apuracao-2026/app.bundle.js
          grep -q "governorMapPanel" apuracao-2026/app.bundle.js
          grep -q "candidate-projected-elected" apuracao-2026/app.bundle.js
          grep -q "Projetado eleito · cálculo atual" apuracao-2026/app.bundle.js
          grep -q "candidate-official-elected" apuracao-2026/app.css
          grep -q "pres-apuration-card" apuracao-2026/app.bundle.js
          grep -q "seções restantes" apuracao-2026/app.bundle.js
          grep -q "pres-apuration-track" apuracao-2026/app.css
          grep -q "BrMap.Draw" apuracao-2026/app.bundle.js
          grep -q "brmap.js" apuracao-2026/index.html
          grep -q "Candidatos e votos" apuracao-2026/app.bundle.js
          grep -q "renderProportionalCandidateRanking" apuracao-2026/app.bundle.js
          grep -q "Seções/urnas totalizadas" apuracao-2026/app.bundle.js
          grep -q "secoesTotalizadas" apuracao-2026/app.bundle.js
          grep -q "gov-elected" apuracao-2026/app.bundle.js
          grep -q "gov-runoff" apuracao-2026/app.bundle.js
          grep -q "scroll-snap-type:x" apuracao-2026/app.css
      - name: Validate live TSE proxy used by Render
        run: |
          set -e
          curl -fsS --retry 3 "https://apuracao-2026-lake.vercel.app/api/search?q=ana%20paula%20siqueira&uf=mg&cargo=7" | grep -q "ANA PAULA SIQUEIRA"
          curl -fsS --retry 3 "https://apuracao-2026-lake.vercel.app/api/tse?path=%2Foficial%2Fele2026%2F6257%2Fdados%2Fbr%2Fbr-c0001-e006257-u.json" | grep -q '"ele" : "6257"'
