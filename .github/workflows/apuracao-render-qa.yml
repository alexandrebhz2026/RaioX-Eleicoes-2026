name: Apuracao 2026 Render QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'apuracao-2026/**'
      - '.github/workflows/apuracao-render-qa.yml'

jobs:
  qa-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          set -e
          node --check apuracao-2026/app.bundle.js
          grep -q "renderSecondRoundPresident" apuracao-2026/app.bundle.js
          grep -q "polls-2026.json" apuracao-2026/app.bundle.js
          grep -q "secondRoundStage" apuracao-2026/app.bundle.js
          grep -q "requestedMode" apuracao-2026/app.bundle.js
          grep -q "\"institute\": \"Datafolha\"" apuracao-2026/polls-2026.json
          grep -q "\"institute\": \"Quaest\"" apuracao-2026/polls-2026.json
          grep -q "\"institute\": \"AtlasIntel/Bloomberg\"" apuracao-2026/polls-2026.json
      - name: Wait for Render auto deploy
        run: sleep 20
      - name: Validate home on mobile
        run: |
          set -e
          base="https://apuracao-2026.onrender.com"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=18000 --dump-dom "$base/?qa=$GITHUB_SHA" > /tmp/home.html
          grep -q "Apuração em tempo real" /tmp/home.html
          grep -q "2º turno" /tmp/home.html
          grep -q 'data-scroll-x="ok"' /tmp/home.html
      - name: Validate second-round screen
        run: |
          set -e
          base="https://apuracao-2026.onrender.com"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=18000 --dump-dom "$base/?view=presidente&mode=round2&qa=$GITHUB_SHA" > /tmp/round2.html
          grep -q "Brasil · 2º turno" /tmp/round2.html
          grep -q "Classificados pelo TSE" /tmp/round2.html
          grep -q "Pesquisas" /tmp/round2.html
      - name: Validate polls screen
        run: |
          set -e
          base="https://apuracao-2026.onrender.com"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=18000 --dump-dom "$base/?view=presidente&mode=polls&qa=$GITHUB_SHA" > /tmp/polls.html
          grep -q "Pesquisas eleitorais" /tmp/polls.html
          grep -q "Datafolha" /tmp/polls.html
          grep -q "Quaest" /tmp/polls.html
          grep -q "AtlasIntel" /tmp/polls.html
          grep -q "margem" /tmp/polls.html
      - name: Validate live TSE proxy
        run: |
          set -e
          curl -fsS --retry 3 "https://apuracao-2026-lake.vercel.app/api/tse?path=%2Foficial%2Fcomum%2Fconfig%2Fele-c.json" | grep -q "Eleição Ordinária Federal - 2026 1º Turno"
