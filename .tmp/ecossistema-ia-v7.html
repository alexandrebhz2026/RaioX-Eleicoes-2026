<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ecossistema IA</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#718096;--line:#e7ebf2;--shadow:0 18px 45px rgba(30,41,59,.08);--purple:#6857f5;--green:#12947f;--orange:#ef7b3f;--danger:#e75858}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:rgba(18,24,39,.96);color:#fff}.topin{max-width:1460px;margin:auto;min-height:72px;padding:12px 22px;display:flex;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;white-space:nowrap}.brandmark{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#7565ff,#4b3fc5);display:grid;place-items:center;box-shadow:0 8px 22px rgba(104,87,245,.35)}.switcher{display:flex;gap:7px;flex:1;overflow:auto}.switcher button{border:0;background:transparent;color:#b9c3d3;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap}.switcher button.active{background:#fff;color:#172033}.top-actions{display:flex;gap:8px}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#223047;color:#d7e1ee}.avatar{width:38px;height:38px;border-radius:12px;background:#263247;display:grid;place-items:center;font-weight:800}.page{max-width:1460px;margin:auto;padding:26px 22px 44px}.hero{display:flex;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#8b96a9}.hero h1{font-size:30px;line-height:1.15;margin:7px 0 6px}.hero p{margin:0;color:var(--muted);max-width:760px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:#172033;color:#fff}.btn.secondary{background:#fff;color:#243047;border:1px solid var(--line)}.btn.purple{background:var(--purple)}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.tiny{padding:7px 9px;font-size:12px}.grid{display:grid;gap:14px}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.metric{padding:17px}.metric .label{color:var(--muted);font-size:12px;font-weight:700}.metric .value{font-size:25px;font-weight:900;margin:6px 0 2px}.metric .delta{font-size:12px;color:var(--muted)}.section{margin-top:16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionhead h2{font-size:17px;margin:0}.sectionhead span{color:var(--muted);font-size:12px}.panel{padding:18px}.appcards{grid-template-columns:repeat(3,1fr)}.appcard{padding:20px}.appicon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:white;font-size:23px;background:var(--accent)}.appcard h3{font-size:20px;margin:15px 0 4px}.appcard p{color:var(--muted);margin:0 0 15px}.appstats{display:flex;gap:18px;margin:15px 0}.appstats b{display:block;font-size:17px}.appstats span{font-size:11px;color:var(--muted)}.context{border:1px solid #dfe5ef;background:#fbfcff;border-radius:16px;padding:15px;display:flex;align-items:center;gap:12px}.context .ci{width:38px;height:38px;border-radius:12px;background:#eef0ff;color:var(--purple);display:grid;place-items:center;font-size:18px;flex:0 0 auto}.context .ct{flex:1}.context b{display:block}.context small{color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:210px}.search input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:none}.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto}.lane{background:#eef2f7;border-radius:17px;padding:10px;min-height:340px}.lanehead{display:flex;justify-content:space-between;padding:6px 6px 10px;font-weight:800}.lanehead span{color:var(--muted);font-size:11px;background:white;border-radius:999px;padding:3px 7px}.lead{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:13px;margin-bottom:9px}.leadtop{display:flex;justify-content:space-between;gap:8px}.lead h4{margin:0 0 3px}.lead small{color:var(--muted)}.money{font-weight:900}.leadmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#f0f3f7}.chip.hot{background:#fff0e9;color:#b75422}.leadfoot{display:flex;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid #eef1f5}.linkbtn{border:0;background:none;color:#5a63d8;font-weight:800;cursor:pointer;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5}.table th{font-size:11px;text-transform:uppercase;color:#8a94a6}.status{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:800}.st-open{background:#fff4d9;color:#9b6e00}.st-done{background:#e6f7f1;color:#08725f}.st-route{background:#eaf1ff;color:#3561b5}.st-cancel{background:#feeaea;color:#b84040}.tabs2{display:flex;gap:7px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs2 button{border:0;background:transparent;padding:8px 10px;border-radius:9px;color:#69768a;font-weight:800;cursor:pointer}.tabs2 button.active{background:#eef1f6;color:#202b3e}.taskrow,.cashrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f5}.check{width:20px;height:20px;border-radius:7px;border:1.5px solid #bac4d3;display:grid;place-items:center;cursor:pointer}.check.done{background:var(--green);border-color:var(--green);color:white}.grow{flex:1}.grow b{display:block}.grow small{color:var(--muted)}.right{text-align:right}.amount.in{color:#15806d;font-weight:900}.amount.out{color:#d05b5b;font-weight:900}.priority-high{color:#c24e4e;font-weight:800}.priority-mid{color:#b47c17;font-weight:800}.priority-low{color:#3d7d68;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#f7f9fc;border:1px solid #e9edf3;border-radius:11px;min-height:76px;padding:8px}.evt{margin-top:6px;padding:5px 6px;border-radius:7px;background:#fff;border-left:3px solid var(--orange);font-size:10px}.empty{padding:30px;text-align:center;color:var(--muted)}.modalbg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.52);z-index:70}.modalbg.on{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px}.modalhead{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modalhead h3{margin:0}.close{border:0;background:#f1f4f8;width:34px;height:34px;border-radius:10px}.modalbody{padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:800;color:#69778b;margin-bottom:6px}.field.full{grid-column:1/-1}.field textarea{min-height:86px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;padding:15px 20px;border-top:1px solid var(--line)}.toast{position:fixed;right:18px;bottom:18px;background:#152033;color:#fff;padding:12px 15px;border-radius:12px;opacity:0;transition:.2s}.toast.on{opacity:1}@media(max-width:1000px){.cols4{grid-template-columns:repeat(2,1fr)}.appcards{grid-template-columns:1fr}.hero{flex-direction:column}}@media(max-width:700px){.page{padding:20px 14px}.topin{padding:10px 14px;flex-wrap:wrap}.brand{width:100%}.switcher{order:3;width:100%}.pill{display:none}.cols4,.cols3{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.kanban{grid-template-columns:repeat(5,250px)}.tablewrap{overflow:auto}.calendar{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.cols4,.cols3{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="topbar"><div class="topin"><div class="brand"><div class="brandmark">✦</div>Ecossistema IA</div><nav class="switcher" id="switcher"><button data-view="home" class="active">Visão geral</button><button data-view="sales">Vendas IA</button><button data-view="manage">Gestão IA</button><button data-view="services">Serviços IA</button></nav><div class="top-actions"><div class="pill">Dados salvos neste dispositivo</div><div class="avatar">AM</div></div></div></header><main class="page" id="app"></main></div><div class="modalbg" id="mb" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0)),uid=()=>Math.random().toString(36).slice(2,9);const store={get:(k,f)=>{try{return JSON.parse(localStorage.getItem('ecoia.'+k))??f}catch(e){return f}},set:(k,v)=>localStorage.setItem('ecoia.'+k,JSON.stringify(v))};
const seedSales=[{id:uid(),company:'Horizonte Engenharia',contact:'Marina Alves',value:18900,stage:'proposal',source:'Indicação',temperature:'hot',next:'Ligar hoje às 16h',note:'Proposta enviada'},{id:uid(),company:'Clínica Vida+',contact:'Rafael Costa',value:9500,stage:'diagnosis',source:'Instagram',temperature:'warm',next:'Enviar diagnóstico',note:'Quer automatizar atendimento'},{id:uid(),company:'Norte Logística',contact:'Bianca Lima',value:27600,stage:'new',source:'Site',temperature:'hot',next:'Contato em até 2h',note:'Lead inbound'},{id:uid(),company:'Studio Lume',contact:'Paulo Reis',value:6800,stage:'negotiation',source:'WhatsApp',temperature:'warm',next:'Retomar amanhã',note:'Negociando prazo'},{id:uid(),company:'Odonto Prime',contact:'Carla Nunes',value:12200,stage:'won',source:'Indicação',temperature:'hot',next:'Implantação',note:'Fechado hoje'}];
const seedTasks=[{id:uid(),title:'Revisar fluxo de caixa da semana',area:'Financeiro',due:'Hoje',priority:'high',done:false},{id:uid(),title:'Validar escala operacional',area:'Operação',due:'Amanhã',priority:'mid',done:false},{id:uid(),title:'Conferir contratos a vencer',area:'Administrativo',due:'18/09',priority:'mid',done:false},{id:uid(),title:'Atualizar metas comerciais',area:'Comercial',due:'Hoje',priority:'high',done:true}];
const seedCash=[{id:uid(),desc:'Recebimento mensalidade',type:'in',value:12500,date:'Hoje'},{id:uid(),desc:'Folha complementar',type:'out',value:4800,date:'Hoje'},{id:uid(),desc:'Fornecedor tecnologia',type:'out',value:2150,date:'15/09'},{id:uid(),desc:'Projeto Horizonte',type:'in',value:6200,date:'14/09'}];
const seedOS=[{id:uid(),client:'Horizonte Engenharia',service:'Implantação inicial',date:'Hoje 09:30',team:'Equipe Norte',status:'route',value:2400,notes:'Acesso liberado'},{id:uid(),client:'Clínica Vida+',service:'Diagnóstico presencial',date:'Hoje 11:00',team:'Equipe Centro',status:'scheduled',value:900,notes:'Falar com Rafael'},{id:uid(),client:'Mercado Central',service:'Manutenção preventiva',date:'Hoje 15:30',team:'Equipe Sul',status:'scheduled',value:650,notes:'Levar kit B'},{id:uid(),client:'Alfa Contábil',service:'Suporte avançado',date:'17/09 10:00',team:'Equipe Centro',status:'done',value:480,notes:'Finalizado'}];
if(!localStorage.getItem('ecoia.sales'))store.set('sales',seedSales);if(!localStorage.getItem('ecoia.tasks'))store.set('tasks',seedTasks);if(!localStorage.getItem('ecoia.cash'))store.set('cash',seedCash);if(!localStorage.getItem('ecoia.os'))store.set('os',seedOS);let view=(location.hash||'#home').slice(1),manageTab='tasks',serviceTab='orders',salesSearch='';const stages=[['new','Novo lead'],['diagnosis','Diagnóstico'],['proposal','Proposta'],['negotiation','Negociação'],['won','Fechado']];const sales=()=>store.get('sales',[]),tasks=()=>store.get('tasks',[]),cash=()=>store.get('cash',[]),orders=()=>store.get('os',[]);function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}function goto(v){view=v;location.hash=v;render()}$$('#switcher button').forEach(b=>b.onclick=()=>goto(b.dataset.view));function metrics(){const s=sales(),t=tasks(),c=cash(),o=orders();return{pipeline:s.filter(x=>x.stage!=='won').reduce((a,x)=>a+Number(x.value),0),won:s.filter(x=>x.stage==='won').reduce((a,x)=>a+Number(x.value),0),openTasks:t.filter(x=>!x.done).length,balance:c.reduce((a,x)=>a+(x.type==='in'?1:-1)*Number(x.value),0),activeOS:o.filter(x=>!['done','cancel'].includes(x.status)).length,today:o.filter(x=>String(x.date).startsWith('Hoje')).length}}
function render(){if(!['home','sales','manage','services'].includes(view))view='home';$$('#switcher button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#app').innerHTML=view==='home'?homeHTML():view==='sales'?salesHTML():view==='manage'?manageHTML():servicesHTML();const s=$('#salesSearch');if(s)s.oninput=e=>{salesSearch=e.target.value;render()}}
function homeHTML(){const m=metrics(),s=sales(),hot=s.filter(x=>x.temperature==='hot'&&x.stage!=='won').length;return `<div class="hero"><div><div class="eyebrow">Painel central</div><h1>Seu negócio em três frentes, sem misturar as operações.</h1><p>Cada aplicativo mantém seus próprios dados. O Ecossistema IA apenas identifica momentos em que um app pode ajudar o outro.</p></div><div class="actions"><button class="btn secondary" onclick="openQuick()">+ Ação rápida</button><button class="btn purple" onclick="goto('sales')">Abrir Vendas IA</button></div></div><div class="grid appcards"><div class="card appcard" style="--accent:var(--purple)"><div class="appicon">↗</div><h3>Vendas IA</h3><p>CRM leve, pipeline, propostas e próximos passos.</p><div class="appstats"><div><b>${s.length}</b><span>oportunidades</span></div><div><b>${fmt(m.pipeline)}</b><span>pipeline</span></div></div><button class="btn purple" onclick="goto('sales')">Entrar</button></div><div class="card appcard" style="--accent:var(--green)"><div class="appicon">▦</div><h3>Gestão IA</h3><p>Tarefas, prioridades, caixa e acompanhamento diário.</p><div class="appstats"><div><b>${m.openTasks}</b><span>pendências</span></div><div><b>${fmt(m.balance)}</b><span>saldo</span></div></div><button class="btn green" onclick="goto('manage')">Entrar</button></div><div class="card appcard" style="--accent:var(--orange)"><div class="appicon">✦</div><h3>Serviços IA</h3><p>Ordens de serviço, agenda, equipes e execução.</p><div class="appstats"><div><b>${m.activeOS}</b><span>OS ativas</span></div><div><b>${m.today}</b><span>hoje</span></div></div><button class="btn orange" onclick="goto('services')">Entrar</button></div></div><div class="section grid cols3"><div class="context"><div class="ci">⚡</div><div class="ct"><b>${hot} leads quentes</b><small>Priorize contatos.</small></div><button class="btn tiny purple" onclick="goto('sales')">Ver</button></div><div class="context"><div class="ci">✓</div><div class="ct"><b>${m.openTasks} pendências</b><small>Organize o dia.</small></div><button class="btn tiny green" onclick="goto('manage')">Ver</button></div><div class="context"><div class="ci">⌁</div><div class="ct"><b>${m.activeOS} serviços ativos</b><small>Acompanhe equipes.</small></div><button class="btn tiny orange" onclick="goto('services')">Ver</button></div></div>`}
function salesHTML(){const all=sales(),q=salesSearch.toLowerCase(),filtered=all.filter(x=>(x.company+' '+x.contact+' '+x.source).toLowerCase().includes(q)),open=all.filter(x=>x.stage!=='won'),pipe=open.reduce((a,x)=>a+Number(x.value),0),won=all.filter(x=>x.stage==='won').reduce((a,x)=>a+Number(x.value),0),hot=open.filter(x=>x.temperature==='hot').length,conv=all.length?Math.round(all.filter(x=>x.stage==='won').length/all.length*100):0;return `<div class="hero"><div><div class="eyebrow">Aplicativo independente</div><h1>Vendas IA</h1><p>Organize oportunidades do primeiro contato ao fechamento.</p></div><div class="actions"><button class="btn purple" onclick="openLead()">+ Novo lead</button></div></div><div class="grid cols4"><div class="card metric"><div class="label">Pipeline</div><div class="value">${fmt(pipe)}</div><div class="delta">${open.length} oportunidades</div></div><div class="card metric"><div class="label">Fechado</div><div class="value">${fmt(won)}</div></div><div class="card metric"><div class="label">Conversão</div><div class="value">${conv}%</div></div><div class="card metric"><div class="label">Leads quentes</div><div class="value">${hot}</div></div></div><div class="section"><div class="toolbar"><div class="search"><input id="salesSearch" value="${esc(salesSearch)}" placeholder="Buscar empresa, contato ou origem..."></div><button class="btn secondary" onclick="openLead()">Cadastrar oportunidade</button></div><div class="kanban">${stages.map(([id,label])=>{const items=filtered.filter(x=>x.stage===id);return `<div class="lane"><div class="lanehead">${label}<span>${items.length}</span></div>${items.map(leadCard).join('')||'<div class="empty">Nenhum lead</div>'}</div>`}).join('')}</div></div><div class="section context"><div class="ci">✦</div><div class="ct"><b>Venda fechada pode virar implantação.</b><small>Crie uma OS no Serviços IA somente quando fizer sentido.</small></div><button class="btn tiny purple" onclick="suggestServiceFromWon()">Criar OS</button></div>`}
function leadCard(x){return `<div class="lead"><div class="leadtop"><div><h4>${esc(x.company)}</h4><small>${esc(x.contact)}</small></div><div class="money">${fmt(x.value)}</div></div><div class="leadmeta"><span class="chip ${x.temperature==='hot'?'hot':''}">${x.temperature==='hot'?'Quente':x.temperature==='warm'?'Morno':'Frio'}</span><span class="chip">${esc(x.source)}</span></div><div class="leadfoot"><small>${esc(x.next||'Sem próximo passo')}</small><button class="linkbtn" onclick="openLead('${x.id}')">Abrir</button></div></div>`}
function manageHTML(){const t=tasks(),c=cash(),m=metrics(),ins=c.filter(x=>x.type==='in').reduce((a,x)=>a+Number(x.value),0),outs=c.filter(x=>x.type==='out').reduce((a,x)=>a+Number(x.value),0);return `<div class="hero"><div><div class="eyebrow">Aplicativo independente</div><h1>Gestão IA</h1><p>Central diária para tarefas, prioridades e movimentações financeiras.</p></div><div class="actions"><button class="btn secondary" onclick="openCash()">+ Lançamento</button><button class="btn green" onclick="openTask()">+ Nova tarefa</button></div></div><div class="grid cols4"><div class="card metric"><div class="label">Pendências</div><div class="value">${m.openTasks}</div></div><div class="card metric"><div class="label">Entradas</div><div class="value">${fmt(ins)}</div></div><div class="card metric"><div class="label">Saídas</div><div class="value">${fmt(outs)}</div></div><div class="card metric"><div class="label">Saldo</div><div class="value">${fmt(m.balance)}</div></div></div><div class="section card panel"><div class="tabs2"><button class="${manageTab==='tasks'?'active':''}" onclick="manageTab='tasks';render()">Tarefas</button><button class="${manageTab==='cash'?'active':''}" onclick="manageTab='cash';render()">Caixa</button></div>${manageTab==='tasks'?taskList(t):cashList(c)}</div><div class="section context"><div class="ci">↗</div><div class="ct"><b>Meta comercial travou?</b><small>Abra o Vendas IA sem levar dados financeiros junto.</small></div><button class="btn tiny green" onclick="goto('sales')">Ir para Vendas</button></div>`}
function taskList(t){return `<div class="sectionhead"><h2>Plano de ação</h2><span>${t.filter(x=>!x.done).length} em aberto</span></div>${t.map(x=>`<div class="taskrow"><div class="check ${x.done?'done':''}" onclick="toggleTask('${x.id}')">${x.done?'✓':''}</div><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.area)} • ${esc(x.due)}</small></div><div class="right"><div class="priority-${x.priority}">${x.priority==='high'?'Alta':x.priority==='mid'?'Média':'Baixa'}</div><button class="linkbtn" onclick="deleteTask('${x.id}')">Excluir</button></div></div>`).join('')}`}
function cashList(c){return `<div class="sectionhead"><h2>Movimentações</h2><span>${c.length} lançamentos</span></div>${c.map(x=>`<div class="cashrow"><div class="grow"><b>${esc(x.desc)}</b><small>${esc(x.date)}</small></div><div class="right"><div class="amount ${x.type}">${x.type==='in'?'+ ':'- '}${fmt(x.value)}</div><button class="linkbtn" onclick="deleteCash('${x.id}')">Excluir</button></div></div>`).join('')}`}
function servicesHTML(){const o=orders(),m=metrics(),rev=o.filter(x=>x.status==='done').reduce((a,x)=>a+Number(x.value),0);return `<div class="hero"><div><div class="eyebrow">Aplicativo independente</div><h1>Serviços IA</h1><p>Controle ordens de serviço, equipes e agenda operacional.</p></div><div class="actions"><button class="btn secondary" onclick="serviceTab=serviceTab==='orders'?'calendar':'orders';render()">${serviceTab==='orders'?'Ver agenda':'Ver lista'}</button><button class="btn orange" onclick="openOS()">+ Nova OS</button></div></div><div class="grid cols4"><div class="card metric"><div class="label">OS ativas</div><div class="value">${m.activeOS}</div></div><div class="card metric"><div class="label">Atendimentos hoje</div><div class="value">${m.today}</div></div><div class="card metric"><div class="label">Receita concluída</div><div class="value">${fmt(rev)}</div></div><div class="card metric"><div class="label">Base operacional</div><div class="value">${o.length}</div></div></div><div class="section card panel">${serviceTab==='orders'?osList(o):calendarHTML(o)}</div><div class="section context"><div class="ci">↗</div><div class="ct"><b>Cliente pediu ampliação?</b><small>Crie uma oportunidade no Vendas IA e mantenha a OS aqui.</small></div><button class="btn tiny orange" onclick="serviceToSale()">Criar oportunidade</button></div>`}
function osList(o){return `<div class="sectionhead"><h2>Ordens de serviço</h2><span>${o.length} registros</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Cliente / serviço</th><th>Agenda</th><th>Equipe</th><th>Status</th><th>Valor</th><th></th></tr></thead><tbody>${o.map(x=>`<tr><td><b>${esc(x.client)}</b><br><small>${esc(x.service)}</small></td><td>${esc(x.date)}</td><td>${esc(x.team)}</td><td>${statusBadge(x.status)}</td><td><b>${fmt(x.value)}</b></td><td><button class="linkbtn" onclick="openOS('${x.id}')">Abrir</button></td></tr>`).join('')}</tbody></table></div>`}function statusBadge(s){const map={scheduled:['Agendado','st-open'],route:['Em rota','st-route'],progress:['Em execução','st-route'],done:['Concluído','st-done'],cancel:['Cancelado','st-cancel']};const a=map[s]||[s,''];return `<span class="status ${a[1]}">${a[0]}</span>`}function calendarHTML(o){const days=['Hoje','17/09','18/09','19/09','20/09','21/09','22/09'];return `<div class="sectionhead"><h2>Agenda</h2><span>Próximos dias</span></div><div class="calendar">${days.map(d=>{const ev=o.filter(x=>String(x.date).startsWith(d));return `<div class="day"><b>${d}</b>${ev.map(x=>`<div class="evt">${esc(x.client)}<br>${esc(x.date.replace(d,'').trim())}</div>`).join('')||'<div class="empty" style="padding:10px">Livre</div>'}</div>`}).join('')}</div>`}
function modal(title,body,saveLabel,onSave){$('#modal').innerHTML=`<div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="modalSave">${saveLabel}</button></div>`;$('#mb').classList.add('on');$('#modalSave').onclick=onSave}function closeModal(){$('#mb').classList.remove('on')}
function openLead(id){const arr=sales(),x=arr.find(a=>a.id===id)||{company:'',contact:'',value:'',stage:'new',source:'WhatsApp',temperature:'warm',next:'',note:''};modal(id?'Editar oportunidade':'Novo lead',`<div class="formgrid"><div class="field"><label>Empresa *</label><input id="fCompany" value="${esc(x.company)}"></div><div class="field"><label>Contato</label><input id="fContact" value="${esc(x.contact)}"></div><div class="field"><label>Valor estimado</label><input id="fValue" type="number" value="${x.value}"></div><div class="field"><label>Etapa</label><select id="fStage">${stages.map(s=>`<option value="${s[0]}" ${x.stage===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div><div class="field"><label>Origem</label><select id="fSource">${['WhatsApp','Site','Instagram','Indicação','Prospecção','Outro'].map(v=>`<option ${x.source===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Temperatura</label><select id="fTemp"><option value="hot" ${x.temperature==='hot'?'selected':''}>Quente</option><option value="warm" ${x.temperature==='warm'?'selected':''}>Morno</option><option value="cold" ${x.temperature==='cold'?'selected':''}>Frio</option></select></div><div class="field full"><label>Próximo passo</label><input id="fNext" value="${esc(x.next)}"></div><div class="field full"><label>Observações</label><textarea id="fNote">${esc(x.note)}</textarea></div></div>`,id?'Salvar':'Cadastrar',()=>{const company=$('#fCompany').value.trim();if(!company)return toast('Informe a empresa');const obj={...x,id:id||uid(),company,contact:$('#fContact').value.trim(),value:Number($('#fValue').value||0),stage:$('#fStage').value,source:$('#fSource').value,temperature:$('#fTemp').value,next:$('#fNext').value.trim(),note:$('#fNote').value.trim()};let a=sales();a=id?a.map(v=>v.id===id?obj:v):[obj,...a];store.set('sales',a);closeModal();render();toast('Oportunidade salva')})}
function openTask(){modal('Nova tarefa',`<div class="formgrid"><div class="field full"><label>Tarefa *</label><input id="tTitle"></div><div class="field"><label>Área</label><select id="tArea"><option>Administrativo</option><option>Financeiro</option><option>Comercial</option><option>Operação</option></select></div><div class="field"><label>Prazo</label><input id="tDue" value="Hoje"></div><div class="field"><label>Prioridade</label><select id="tPri"><option value="high">Alta</option><option value="mid">Média</option><option value="low">Baixa</option></select></div></div>`,'Criar',()=>{const title=$('#tTitle').value.trim();if(!title)return toast('Informe a tarefa');store.set('tasks',[{id:uid(),title,area:$('#tArea').value,due:$('#tDue').value,priority:$('#tPri').value,done:false},...tasks()]);closeModal();render()})}function toggleTask(id){store.set('tasks',tasks().map(x=>x.id===id?{...x,done:!x.done}:x));render()}function deleteTask(id){store.set('tasks',tasks().filter(x=>x.id!==id));render()}
function openCash(){modal('Novo lançamento',`<div class="formgrid"><div class="field full"><label>Descrição *</label><input id="cDesc"></div><div class="field"><label>Tipo</label><select id="cType"><option value="in">Entrada</option><option value="out">Saída</option></select></div><div class="field"><label>Valor</label><input id="cValue" type="number"></div><div class="field"><label>Data</label><input id="cDate" value="Hoje"></div></div>`,'Adicionar',()=>{const desc=$('#cDesc').value.trim(),value=Number($('#cValue').value||0);if(!desc||!value)return toast('Informe descrição e valor');store.set('cash',[{id:uid(),desc,type:$('#cType').value,value,date:$('#cDate').value},...cash()]);closeModal();manageTab='cash';render()})}function deleteCash(id){store.set('cash',cash().filter(x=>x.id!==id));render()}
function openOS(id,prefill){const arr=orders(),x=arr.find(a=>a.id===id)||{client:prefill?.client||'',service:prefill?.service||'',date:'Hoje ',team:'Equipe Centro',status:'scheduled',value:prefill?.value||'',notes:prefill?.notes||''};modal(id?'Editar OS':'Nova ordem de serviço',`<div class="formgrid"><div class="field"><label>Cliente *</label><input id="oClient" value="${esc(x.client)}"></div><div class="field"><label>Serviço *</label><input id="oService" value="${esc(x.service)}"></div><div class="field"><label>Data e hora</label><input id="oDate" value="${esc(x.date)}"></div><div class="field"><label>Equipe</label><select id="oTeam">${['Equipe Norte','Equipe Centro','Equipe Sul','Equipe Externa'].map(v=>`<option ${x.team===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="oStatus"><option value="scheduled" ${x.status==='scheduled'?'selected':''}>Agendado</option><option value="route" ${x.status==='route'?'selected':''}>Em rota</option><option value="progress" ${x.status==='progress'?'selected':''}>Em execução</option><option value="done" ${x.status==='done'?'selected':''}>Concluído</option></select></div><div class="field"><label>Valor</label><input id="oValue" type="number" value="${x.value}"></div><div class="field full"><label>Observações</label><textarea id="oNotes">${esc(x.notes)}</textarea></div></div>`,id?'Salvar':'Criar OS',()=>{const client=$('#oClient').value.trim(),service=$('#oService').value.trim();if(!client||!service)return toast('Informe cliente e serviço');const obj={...x,id:id||uid(),client,service,date:$('#oDate').value,team:$('#oTeam').value,status:$('#oStatus').value,value:Number($('#oValue').value||0),notes:$('#oNotes').value};let a=orders();a=id?a.map(v=>v.id===id?obj:v):[obj,...a];store.set('os',a);closeModal();render()})}
function suggestServiceFromWon(){const x=sales().find(x=>x.stage==='won');if(!x)return toast('Nenhuma venda fechada');goto('services');setTimeout(()=>openOS(null,{client:x.company,service:'Implantação',value:x.value,notes:'Origem: Vendas IA'}),30)}function serviceToSale(){const o=orders()[0];goto('sales');setTimeout(()=>{const id=uid();store.set('sales',[{id,company:o?.client||'',contact:'',value:0,stage:'new',source:'Indicação',temperature:'hot',next:'Retornar solicitação de ampliação',note:o?`Origem: OS ${o.service}`:''},...sales()]);openLead(id)},30)}function openQuick(){modal('Ação rápida',`<div class="grid cols3"><button class="btn purple" onclick="closeModal();goto('sales');setTimeout(()=>openLead(),30)">Novo lead</button><button class="btn green" onclick="closeModal();goto('manage');setTimeout(()=>openTask(),30)">Nova tarefa</button><button class="btn orange" onclick="closeModal();goto('services');setTimeout(()=>openOS(),30)">Nova OS</button></div>`,'Fechar',closeModal)}render();
</script></body></html>
